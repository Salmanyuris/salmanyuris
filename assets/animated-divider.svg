<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 4" width="100%" height="4">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a74" />
      <stop offset="25%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="75%" stop-color="#ff2a74" />
      <stop offset="100%" stop-color="#8b5cf6" />
